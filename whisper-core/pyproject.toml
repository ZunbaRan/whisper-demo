[tool.poetry]
name = "whisper-core"
version = "0.1.0"
description = "Whisper 音频处理核心服务"
authors = ["Your Name <your.email@example.com>"]
package-mode = false

packages = [
    { include = "api" },
    { include = "core" },
    { include = "models" },
    { include = "services" },
    { include = "utils" }
]

[tool.poetry.dependencies]
python = ">=3.12.0,<3.13"
numpy = "1.26.4"
pandas = "2.2.2"
torch = { version = "2.5.1+cu121", source = "pytorch" }
whisperx = "3.3.1"
fastapi = "0.110.0"
uvicorn = "0.29.0"
pydantic = "2.10.0"
python-multipart = ">=0.0.18"
jinja2 = "^3.1.2"
pydub = "^0.25.1"
pyannote-audio = "3.3.2"
aiofiles = "^24.1.0"
humanize = "4.12.2"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[[tool.poetry.source]]
name = "pytorch"
url = "https://download.pytorch.org/whl/cu121"
priority = "explicit"

[tool.poetry.scripts]
start = "api.api:start_app" 