{% extends "base.html" %}

{% block title %}Deep Research - 深度思考分析{% endblock %}

{% block styles %}
<style>
    .chat-container {
        height: 70vh;
        overflow-y: auto;
        border: 1px solid #e0e0e0;
        border-radius: 8px;
        padding: 15px;
        margin-bottom: 15px;
        background-color: #f9f9f9;
    }
    
    .user-message {
        background-color: #dcf8c6;
        padding: 10px;
        border-radius: 8px;
        margin-bottom: 10px;
        max-width: 80%;
        align-self: flex-end;
        margin-left: auto;
    }
    
    .bot-message {
        background-color: #ffffff;
        padding: 10px;
        border-radius: 8px;
        margin-bottom: 10px;
        max-width: 80%;
        border: 1px solid #e0e0e0;
    }
    
    .input-area {
        display: flex;
        margin-top: 15px;
    }
    
    .message-input {
        flex-grow: 1;
        padding: 10px;
        border: 1px solid #e0e0e0;
        border-radius: 4px;
        margin-right: 10px;
    }
    
    .thinking-status {
        font-style: italic;
        color: #666;
        margin-bottom: 10px;
    }
    
    .reference {
        font-size: 0.85em;
        color: #666;
        border-left: 3px solid #ccc;
        padding-left: 10px;
        margin-top: 5px;
    }
    
    .loader {
        display: inline-block;
        width: 15px;
        height: 15px;
        border: 3px solid rgba(0,0,0,.1);
        border-radius: 50%;
        border-top-color: #3498db;
        animation: spin 1s ease-in-out infinite;
        margin-right: 10px;
    }
    
    @keyframes spin {
        to { transform: rotate(360deg); }
    }
</style>
{% endblock %}

{% block content %}
<div class="container mt-4">
    <h2>Deep Research - 深度思考分析</h2>
    <p class="lead">通过大模型和互联网搜索解决复杂问题</p>
    
    <div class="card mb-4">
        <div class="card-header">
            <h5>配置选项</h5>
        </div>
        <div class="card-body">
            <div class="row">
                <div class="col-md-6">
                    <div class="form-group">
                        <label for="max_search_words">最大搜索次数:</label>
                        <input type="number" id="max_search_words" class="form-control" value="5" min="1" max="10">
                    </div>
                </div>
                <div class="col-md-6">
                    <div class="form-group">
                        <label for="max_planning_rounds">最大思考轮次:</label>
                        <input type="number" id="max_planning_rounds" class="form-control" value="5" min="1" max="10">
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <div class="chat-container" id="chatContainer">
        <!-- 消息会在这里动态添加 -->
    </div>
    
    <div class="input-area">
        <textarea class="message-input" id="messageInput" placeholder="请输入你的问题..." rows="2"></textarea>
        <button class="btn btn-primary" id="sendButton">发送</button>
    </div>
</div>

<script>
    document.addEventListener('DOMContentLoaded', function() {
        const chatContainer = document.getElementById('chatContainer');
        const messageInput = document.getElementById('messageInput');
        const sendButton = document.getElementById('sendButton');
        const maxSearchWords = document.getElementById('max_search_words');
        const maxPlanningRounds = document.getElementById('max_planning_rounds');
        
        let messages = [];
        let isProcessing = false;
        
        sendButton.addEventListener('click', async function() {
            const question = messageInput.value.trim();
            if (question === '' || isProcessing) return;
            
            // 显示用户消息
            addMessage('user', question);
            
            // 清空输入框
            messageInput.value = '';
            
            // 添加思考中提示
            const thinkingElement = document.createElement('div');
            thinkingElement.className = 'thinking-status';
            thinkingElement.innerHTML = '<span class="loader"></span>正在思考中...';
            chatContainer.appendChild(thinkingElement);
            
            // 记录消息
            messages.push({
                role: 'user',
                content: question
            });
            
            isProcessing = true;
            
            try {
                // 发送请求到 API
                const response = await fetch('/api/deep_research', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        messages: messages,
                        stream: false,
                        max_search_words: parseInt(maxSearchWords.value),
                        max_planning_rounds: parseInt(maxPlanningRounds.value)
                    })
                });
                
                if (!response.ok) {
                    throw new Error('请求失败: ' + response.status);
                }
                
                const data = await response.json();
                
                // 移除思考中提示
                chatContainer.removeChild(thinkingElement);
                
                // 显示模型思考过程
                if (data.choices[0].message.reasoning_content) {
                    addMessage('bot-thinking', data.choices[0].message.reasoning_content);
                }
                
                // 显示最终回答
                addMessage('bot', data.choices[0].message.content);
                
                // 记录回复
                messages.push({
                    role: 'assistant',
                    content: data.choices[0].message.content
                });
            } catch (error) {
                console.error('错误:', error);
                
                // 移除思考中提示
                chatContainer.removeChild(thinkingElement);
                
                // 显示错误消息
                const errorElement = document.createElement('div');
                errorElement.className = 'bot-message';
                errorElement.textContent = '发生错误: ' + error.message;
                chatContainer.appendChild(errorElement);
            } finally {
                isProcessing = false;
                
                // 滚动到底部
                chatContainer.scrollTop = chatContainer.scrollHeight;
            }
        });
        
        // 允许按 Enter 发送消息
        messageInput.addEventListener('keydown', function(e) {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendButton.click();
            }
        });
        
        function addMessage(type, content) {
            const messageElement = document.createElement('div');
            
            if (type === 'user') {
                messageElement.className = 'user-message';
                messageElement.textContent = content;
            } else if (type === 'bot') {
                messageElement.className = 'bot-message';
                messageElement.innerHTML = formatMarkdown(content);
            } else if (type === 'bot-thinking') {
                messageElement.className = 'bot-message';
                messageElement.innerHTML = '<details><summary>思考过程 (点击展开)</summary>'
                    + formatMarkdown(content) + '</details>';
            }
            
            chatContainer.appendChild(messageElement);
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }
        
        function formatMarkdown(text) {
            // 简单的 Markdown 格式化，您可能需要使用更完整的 Markdown 库
            let formatted = text
                .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
                .replace(/\*(.*?)\*/g, '<em>$1</em>')
                .replace(/```(.*?)```/gs, '<pre><code>$1</code></pre>')
                .replace(/`(.*?)`/g, '<code>$1</code>')
                .replace(/\n/g, '<br>');
            
            return formatted;
        }
    });
</script>
{% endblock %}
